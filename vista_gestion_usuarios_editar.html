<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <!-- para que el diseño sea responsivo-->
    <meta name="viewport" content="width=device-width" />
    <title>Ferretería Los Maestros</title>
    <link rel="stylesheet" href="./src/output.css" />
    <script src="./assets/js/vista_admin_usuarios_editar.js" defer></script>
</head>

<body class="bg-stone-100 text-stone-900">
    <!--le agrega un borde inferior color stone y un fondo blanco al nav -->
    <header class="border-b border-stone-300 bg-white">
        <!-- page shell limita el ancho del contenido a un determinado ancho que debe ser el mas pequeño
       entre dos medidas de pantalla. 
       flex convierte los elementos hijos en flexbox, que los ordena como una fila horizontal
       h-20 le da una altura fija al header
       items center centra verticalmente los elementos-->
        <div class="page-shell flex h-20 items-center gap-4">

            <!--aria controls nos dice que mobile menu esta siendo controlado por menu button. -->
            <button id="menu-button" class="simple-icon-button lg:hidden" type="button" aria-label="Abrir menú"
                aria-controls="mobile-menu" aria-expanded="false">
                <!--boton hamburguesa dibujado-->
                <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!--indica que es un link toda esta seccion-->
            <a href="./index.html" class="flex items-center gap-3" aria-label="Ir al inicio">
                <img class="size-12" src="./assets/images/logo-los-maestros.svg" alt="" />
                <span>
                    <!--block ocupa toda la linea disponible y empuja lo que viene despues a la linea siguiente
            leading tight controla el espacio vertical entre las lineas de texto
            tracking tight controla el espacio entre letras de la misma palabra, con tight quedan un poquito mas juntas-->
                    <strong class="block text-xl leading-tight tracking-tight">Los Maestros</strong>
                    <!--hidden no se muestra en pantallas pequeñas
            text y su tamaño
            fuente negrita
            uppercase mayusculas
            tracking y su tamaño especifica el espacio entre letras de la misma palabra
            sm block que se muestra en pantallas mas grandes que no sean celulares-->
                    <span
                        class="hidden text-[0.68rem] font-bold uppercase tracking-[0.18em] text-amber-700 sm:block">Ferretería</span>
                </span>
            </a>

            <!--boton de ingresar a la cuenta-
            sm block que se muestre solo en pantallas grandes-->
            <a id="cuenta"
                class="hidden ml-auto rounded-lg border border-stone-300 px-4 py-2 text-sm font-semibold sm:block"
                href="index.html">Cerrar sesión</a>

        </div>

        <!--
      border t es borde superior
      no ocupa todo el ancho de pantalla por el page shell
      -->
        <nav id="mobile-menu" class="page-shell border-t border-stone-200 py-3 lg:hidden" aria-label="Navegación móvil"
            hidden>
            <a class="mobile-link" href="./index.html">Inicio</a>
            <a class="mobile-link" href="index.html">Cerrar sesión</a>
        </nav>
    </header>

    <main>
        <!--flex-col modo columna en celulares, filas en pantallas grandes-->
        <div class="flex flex-col lg:flex-row min-h-screen">

            <!--m 3 margin 3 espacio en los 4 lados arriba abajo derecha izquierda-->
            <button id="boton-panel" type="button" class="simple-icon-button m-3 lg:hidden" aria-label="Abrir panel"
                aria-controls="panel-lateral" aria-expanded="false">
                <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!--en celulares ocupa todo el ancho de la pantalla con w full
            en pantallas grandes ocupa solo 2 64-->
            <aside id="panel-lateral" class="hidden w-full flex-col bg-stone-900 lg:flex lg:w-64">
                <div class="px-5 py-6 border-b border-stone-800">
                    <p class="text-stone-50 font-semibold text-lg leading-tight">Ferretería<br>Los Maestros</p>
                    <p class="text-stone-500 text-xs mt-1">Panel de administración</p>
                </div>

                <!--space y 1 agrega espacio vertical entre elementos hijos-->
                <nav class="px-3 py-4 space-y-1">
                    <a href="vista_gestion_usuarios.html"
                        class="flex rounded-lg px-4 py-[0.65rem] text-sm font-semibold text-amber-400">
                        Gestión de usuarios
                    </a>

                    <a href="vista_admin_reportes.html"
                        class="flex rounded-lg px-4 py-[0.65rem] text-sm text-stone-300 transition-colors hover:bg-stone-800 hover:text-stone-50">
                        Reportes
                    </a>
                    <a href="vista_admin_inventario.html"
                        class="flex rounded-lg px-4 py-[0.65rem] text-sm text-stone-300 transition-colors hover:bg-stone-800 hover:text-stone-50">
                        Gestión de inventario
                    </a>
                    <a href="vista_admin_pedidos.html"
                        class="flex rounded-lg px-4 py-[0.65rem] text-sm text-stone-300 transition-colors hover:bg-stone-800 hover:text-stone-50">
                        Gestionar pedidos
                    </a>
                    <a href="vista_admin_cuentas.html"
                        class="flex rounded-lg px-4 py-[0.65rem] text-sm text-stone-300 transition-colors hover:bg-stone-800 hover:text-stone-50">
                        Cuentas corrientes
                    </a>

                    <a href="vista_admin_cuentas.html"
                        class="flex rounded-lg px-4 py-[0.65rem] text-sm text-stone-300 transition-colors hover:bg-stone-800 hover:text-stone-50">
                        Historial pedidos
                    </a>
                </nav>
            </aside>

            <!--en el caso de flex row crece y ocupa todo el espacio disponible horizontal-->
            <div class="flex-1 px-8 py-10">

                <h1 class="text-3xl font-semibold text-stone-900 text-center mb-10 mt-4">Editar usuario - Administrador
                </h1>

                <!--mx auto centra horizontalmente el elemento
                p es padding, espacio interno-->
                <div class="mx-auto w-full max-w-2xl rounded-xl border border-stone-300 bg-white p-6 sm:p-8">
                    <!--space y 4 agrega espacio vertical entre los elementos-->
                    <form id="form-editar-usuario" class="space-y-4" novalidate>

                        <p id="editar-usuario-error"
                            class="hidden rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm font-semibold text-red-700"
                            role="alert"></p>

                        <div class="grid gap-4 sm:grid-cols-2">

                            <div>
                                <label class="mb-1 block text-sm font-semibold">RUT</label>
                                <input id="editar-rut" name="rut" type="text" maxlength="12" required
                                    value="12.345.678-9"
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500" />
                            </div>

                            <div>
                                <label class="mb-1 block text-sm font-semibold" >Rol</label>
                                <select id="editar-rol" name="rol" required
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500">
                                    <option value="admin">Admin</option>
                                    <option value="vendedor">Vendedor</option>
                                    <option value="cliente" selected>Cliente</option>
                                </select>
                            </div>

                            <div>
                                <label class="mb-1 block text-sm font-semibold">Nombre</label>
                                <input id="editar-nombre" name="nombre" type="text" maxlength="100" required
                                    value="María"
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500" />
                            </div>

                            <div>
                                <label class="mb-1 block text-sm font-semibold">Apellidos</label>
                                <input id="editar-apellidos" name="apellidos" type="text" maxlength="100" required
                                    value="González Pérez"
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500" />
                            </div>

                            <div class="sm:col-span-2">
                                <label class="mb-1 block text-sm font-semibold">Correo
                                    electrónico</label>
                                <input id="editar-correo" name="correo" type="email" maxlength="100" required
                                    value="maria.gonzalez@gmail.com"
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500" />
                            </div>

                            <div>
                                <label class="mb-1 block text-sm font-semibold" >Región</label>
                                <select id="region" name="region" required
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500">
                                    <option value="">Región Metropolitana</option>
                                </select>
                            </div>

                            <div>
                                <label class="mb-1 block text-sm font-semibold">Comuna</label>
                                <select id="comuna" name="comuna" required disabled
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500 disabled:opacity-50">
                                    <option value="">La Florida</option>
                                </select>
                            </div>

                            <div class="sm:col-span-2">
                                <label class="mb-1 block text-sm font-semibold">Dirección</label>
                                <input id="editar-direccion" name="direccion" type="text" maxlength="150" required
                                    value="Los Carrera 450, La Serena"
                                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-2.5 text-sm outline-none focus:border-amber-500" />
                            </div>

                        </div>

                        <button class="add-button w-full" type="submit">Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer id="contacto" class="bg-stone-900 text-stone-300">
        <div class="border-t border-stone-700 py-4 text-center text-xs">Proyecto académico DSY1104 · 2026</div>
    </footer>
</body>

</html>
